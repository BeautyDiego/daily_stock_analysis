# 均衡多因子策略
name: balanced_alpha
display_name: 均衡多因子
description: 综合估值、资金、动量、稳定性的通用候选发现策略
version: "1.2"
category: framework
tags: [multi_factor, balanced, llm_friendly]
analysis_skills: [bull_trend]
style:
  risk_profile: balanced
  holding_period: watchlist
  execution_style: multi_factor
  market_regime: [neutral, rotation]
  capital_profile: medium_liquidity
  ui_badge: 多因子

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
    amount_min: 100000000
    market_cap_min: 5000000000
    pe_ttm_min: 0
    pe_ttm_max: 80
    pb_min: 0
    pb_max: 8.0
    change_pct_min: -4.0
    change_pct_max: 8.5
    # 小资金可操作性：A 股 1 手 = 100 股。
    # 上限取 20 元：单仓预算 4000 元（20000/5）时，1 手 2000 元、正好买 2 手
    # 用满预算；候选池 1193 → 1505 只（+26%），且保留「1 手/2 手」的调整空间。
    # 更高的上限（25/30）只能买 1 手，资金利用率掉到 62.5%~75%；
    # 上限 40 元则 1 手即占满预算，无法分批。资金规模翻倍后需同步上调。
    price_min: 3
    price_max: 20
  tech_weight: 0.35
  # 权重依据全市场因子分层回测（2026-11-03，5532 只 × 120 个交易日，持有 5 日）：
  #   低波动 stability  正向有效：IC +0.11，IC>0 比例 73%
  #   成交额 liquidity  强反向  ：IC -0.11，IC>0 比例 26%
  #   20 日动量 momentum 反向    ：IC -0.09
  #   量比 activity     反向     ：IC -0.05
  #   近 5 日动量/反转   无区分度 ：IC |0.007|
  # 结论：原来「动量 + 流动性 + 活跃度」合计 53% 的权重押在反向因子上，
  # 现转向「低波动 + 估值」，未验证的 theme_heat / size 小幅提权。
  factor_weights:
    value: 0.30
    stability: 0.28
    size: 0.12
    theme_heat: 0.10
    momentum: 0.05
    liquidity: 0.05
    activity: 0.05
    reversal: 0.05
  scoring_profile:
    momentum_chase_start_pct: 5.5
    momentum_chase_penalty_slope: 12.0
    activity_ideal_volume_ratio: 2.0
    activity_ideal_turnover_rate: 4.0
    stability_hot_change_pct: 7.0
  risk_profile:
    chase_change_pct: 8.0
    abnormal_volume_ratio: 6.0
    high_turnover_rate: 15.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      金融: [券商, 银行, 保险]
      消费: [白酒, 食品, 家电, 零售, 消费]
      AI算力: [AI算力, 算力, 数据中心, 服务器, 光模块]
      新能源: [新能源, 光伏, 锂电, 电池, 储能]
      周期: [钢铁, 煤炭, 有色, 化工]
      公用事业: [电力, 燃气, 水务, 环保, 公用事业]
  scorecard_profile:
    value_quality_bonus: 2.2
    capital_confirmed_bonus: 1.8
    volume_spike_ratio: 5.5
    hot_money_penalty: 2.2
  ranking_hints: |
    优先关注：
    1. 多个维度都不差的候选，而不是单一指标极端突出
    2. LLM 需要比较候选的风格差异，避免最终名单过度集中在同一逻辑
    3. 对估值、资金、趋势、风险之间的冲突给出清楚解释
  max_output: 5
